<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Editar Producto</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-header bg-warning">
                            Editar Producto
                        </div>
                        <div class="card-body">
                            <!-- Mensajes de error -->
                            {% with messages =
                            get_flashed_messages(with_categories=true) %} {% if
                            messages %} {% for category, message in messages %}
                            <div
                                class="alert alert-{{ category }}"
                                role="alert"
                            >
                                {{ message }}
                            </div>
                            {% endfor %} {% endif %} {% endwith %}

                            <!-- Formulario pre-llenado. El 'action' apunta a la ruta de actualizar y pasamos el ID -->
                            <form
                                action="{{ url_for('producto.actualizar', id=producto.id_producto) }}"
                                method="POST"
                            >
                                <div class="mb-3">
                                    <label>Nombre</label>
                                    <!-- value="..." carga el dato actual del producto -->
                                    <input
                                        type="text"
                                        name="nombre"
                                        class="form-control"
                                        value="{{ producto.nombre }}"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label>Descripción</label>
                                    <!-- Los textareas no llevan value="", el texto va entre las etiquetas -->
                                    <textarea
                                        name="descripcion"
                                        class="form-control"
                                    >
{{ producto.descripcion }}</textarea
                                    >
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label>Precio</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            min="0.01"
                                            name="precio"
                                            class="form-control"
                                            value="{{ producto.precio }}"
                                            required
                                        />
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label>Stock</label>
                                        <input
                                            type="number"
                                            min="0"
                                            name="stock"
                                            class="form-control"
                                            value="{{ producto.stock }}"
                                            required
                                        />
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <a
                                        href="{{ url_for('producto.index') }}"
                                        class="btn btn-secondary"
                                        >Cancelar</a
                                    >
                                    <button
                                        type="submit"
                                        class="btn btn-warning"
                                    >
                                        Actualizar Producto
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
